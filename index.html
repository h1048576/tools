<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具集 · 前端开发小工具</title>
  <meta name="description" content="纯前端开发工具集：JSON 格式化、时间戳转换。所有计算均在浏览器本地完成，数据不出浏览器。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg stroke='%23cc785c' stroke-width='2.4' stroke-linecap='round' fill='none'%3E%3Cpath d='M12 3.5v17'/%3E%3Cpath d='M4.5 7.75l15 8.5'/%3E%3Cpath d='M19.5 7.75l-15 8.5'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=15" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" href="#json">
          <span class="brand-mark" data-icon="asterisk"></span>
          <span class="brand-name">工具集</span>
        </a>
        <button type="button" class="icon-btn theme-toggle" aria-label="切换白 / 黑主题" title="切换白 / 黑主题">
          <span data-icon="moon" class="ic-moon"></span>
          <span data-icon="sun" class="ic-sun"></span>
        </button>
      </div>

      <nav class="menu" aria-label="工具导航">
        <div class="menu-label">开发工具</div>
        <a class="menu-item" href="#json" data-tool="json">
          <span data-icon="braces"></span>JSON
        </a>
        <a class="menu-item" href="#timestamp" data-tool="timestamp">
          <span data-icon="clock"></span>时间戳
        </a>
        <div class="menu-item menu-item-soon" aria-disabled="true">
          更多工具<span class="badge-soon">即将上线</span>
        </div>
      </nav>
    </aside>

    <div class="main-area">
      <div class="mobile-topbar">
        <span class="brand">
          <span class="brand-mark" data-icon="asterisk"></span>
          <span class="brand-name">工具集</span>
        </span>
        <div class="topbar-actions">
          <button type="button" class="icon-btn theme-toggle" aria-label="切换白 / 黑主题" title="切换白 / 黑主题">
            <span data-icon="moon" class="ic-moon"></span>
            <span data-icon="sun" class="ic-sun"></span>
          </button>
          <button type="button" class="icon-btn" id="menuToggle" aria-label="打开菜单">
            <span data-icon="menu"></span>
          </button>
        </div>
      </div>

      <main class="workspace">
        <div class="tool-page" id="tool-json"></div>
        <div class="tool-page" id="tool-timestamp" hidden></div>
      </main>
    </div>
  </div>

  <div class="sheet" id="mobileSheet">
    <div class="sheet-head">
      <span class="brand">
        <span class="brand-mark" data-icon="asterisk"></span>
        <span class="brand-name">工具集</span>
      </span>
      <div class="topbar-actions">
        <button type="button" class="icon-btn theme-toggle" aria-label="切换白 / 黑主题" title="切换白 / 黑主题">
          <span data-icon="moon" class="ic-moon"></span>
          <span data-icon="sun" class="ic-sun"></span>
        </button>
        <button type="button" class="icon-btn sheet-close" aria-label="关闭菜单">
          <span data-icon="close"></span>
        </button>
      </div>
    </div>
    <div class="sheet-inner"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- js/ 由 ts/ 编译而来（npm run build），运行时无需构建 -->
  <script src="js/app.js?v=12"></script>
  <script src="js/json-formatter.js?v=22"></script>
  <script src="js/timestamp-converter.js?v=26"></script>
  <script>App.init();</script>
</body>
</html>
